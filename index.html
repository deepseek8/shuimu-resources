<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>水木每日资源清单 · 2026年10月27日</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #4c6ef5;
    --primary-dark: #3b5bdb;
    --text: #1f2933;
    --muted: #7b8794;
    --border: #e4e7eb;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .source { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .notice {
    background: #eef2ff; color: var(--primary-dark);
    border: 1px solid #dbe4ff; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; margin: 18px 0 14px; text-align: center;
  }
  .search {
    width: 100%; padding: 12px 16px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 12px;
    background: #fff; margin-bottom: 20px; outline: none;
    transition: border-color .2s;
  }
  .search:focus { border-color: var(--primary); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.10); }
  .card h3 { font-size: 16px; font-weight: 600; line-height: 1.4; }
  .tag { font-size: 11px; color: var(--muted); background: #f0f2f5; border-radius: 6px; padding: 2px 8px; align-self: flex-start; }
  .btn {
    display: block; text-align: center; text-decoration: none;
    background: var(--primary); color: #fff; font-weight: 600;
    padding: 10px 0; border-radius: 10px; font-size: 14px;
    transition: background .2s;
  }
  .btn:hover { background: var(--primary-dark); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 36px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 10px; text-align: right; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>水木 · 每日资源清单</h1>
    <div class="sub">2026年10月27日更新 · 共 <span id="total">0</span> 条</div>
    <div class="source">来源：shuimu123.com/10yue-2/ · 已全部转存至夸克网盘</div>
  </header>

  <div class="notice">全部为本人网盘分享链接，永久有效、无提取码，点击即可跳转保存。</div>

  <input class="search" id="search" type="text" placeholder="搜索资源名称…" />

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>

  <footer>本页由自动化流程每日生成 · 资源归原作者所有，仅供学习交流</footer>
</div>

<script>
  // 资源数据：name 名称，share 你的新分享链接，original 原链接
  const RESOURCES = [
    { name: "AI暴力涨粉教学，外来技术请自行测试", share: "https://pan.quark.cn/s/130aed8d2b83", original: "https://pan.quark.cn/s/ec5dfbed19b3" },
    { name: "WorkBuddy漫剧AI工作台实战课，掌握AI漫剧创作流程", share: "https://pan.quark.cn/s/7a484dbf2d3c", original: "https://pan.quark.cn/s/42165e9aac33" },
    { name: "Instagram跨境外贸私域实战课，零基础也能跑通海外订单", share: "https://pan.quark.cn/s/f0255ca62dd3", original: "https://pan.quark.cn/s/8f06cc28e082" },
    { name: "MiniMax-H3从入门到实战全流程，零基础也能快速上手", share: "https://pan.quark.cn/s/2c3e2f279072", original: "https://pan.quark.cn/s/abb611322a17" },
    { name: "千川投放从入门到精通，新手也能跑通高ROI投放", share: "https://pan.quark.cn/s/a6e5babe5080", original: "https://pan.quark.cn/s/68e5d6d8c0a4" },
    { name: "《普通人破局醒脑指南》：藏在人性中的生存智慧", share: "https://pan.quark.cn/s/0a93b58132fa", original: "https://pan.quark.cn/s/8d5256f9fe80" },
    { name: "高质量插画教程，多种风格系统提升绘画能力", share: "https://pan.quark.cn/s/1d1b3b3f092e", original: "https://pan.quark.cn/s/98a2217a1f53" },
    { name: "OpenFilm一键成片工具，不会剪辑也能做短视频宣传片", share: "https://pan.quark.cn/s/90ded5e03cab", original: "https://pan.quark.cn/s/46a06d7f17de" },
    { name: "恐龙争霸动画科普，带孩子认识恐龙界的生存绝技", share: "https://pan.quark.cn/s/078476cd30b1", original: "https://pan.quark.cn/s/89f99d326be9" }
  ];

  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");
  document.getElementById("total").textContent = RESOURCES.length;

  function render(list) {
    grid.innerHTML = "";
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">没有匹配的资源</div>';
      countEl.textContent = "";
      return;
    }
    countEl.textContent = "显示 " + list.length + " / " + RESOURCES.length + " 条";
    list.forEach(function (r) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<span class="tag">夸克网盘</span>' +
        '<h3>' + r.name + '</h3>' +
        '<a class="btn" href="' + r.share + '" target="_blank" rel="noopener">打开网盘保存</a>';
      grid.appendChild(card);
    });
  }

  document.getElementById("search").addEventListener("input", function (e) {
    const q = e.target.value.trim().toLowerCase();
    const filtered = RESOURCES.filter(function (r) {
      return r.name.toLowerCase().indexOf(q) > -1;
    });
    render(filtered);
  });

  render(RESOURCES);
</script>
</body>
</html>
