<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>水木每日资源清单</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #4c6ef5;
    --primary-dark: #3b5bdb;
    --text: #1f2933;
    --muted: #7b8794;
    --border: #e4e7eb;
    --head: #f8f9fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
  .source { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .notice {
    background: #eef2ff; color: var(--primary-dark);
    border: 1px solid #dbe4ff; border-radius: 10px;
    padding: 9px 14px; font-size: 13px; margin: 16px 0 14px; text-align: center;
  }
  .search {
    width: 100%; padding: 11px 16px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 12px;
    background: #fff; margin-bottom: 14px; outline: none;
    transition: border-color .2s;
  }
  .search:focus { border-color: var(--primary); }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 12px; text-align: right; }

  /* 每天一块，块间留间距 */
  .day { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
  .day-head {
    background: var(--head); padding: 10px 16px; font-weight: 600; font-size: 15px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .day-head .cnt { font-size: 12px; color: var(--muted); font-weight: 400; }
  .day-body { padding: 2px 16px 6px; }

  /* 紧凑列表行 */
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 2px; border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: none; }
  .item .name {
    flex: 1; font-size: 14px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .seq { color: var(--muted); font-size: 12px; margin-right: 8px; flex: none; }
  .btn {
    flex: none; text-decoration: none; color: #fff; font-weight: 600;
    background: var(--primary); padding: 6px 14px; border-radius: 8px; font-size: 13px;
    transition: background .2s; white-space: nowrap;
  }
  .btn:hover { background: var(--primary-dark); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* 分页 */
  .pager { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .pager button {
    min-width: 36px; padding: 8px 10px; font-size: 14px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; border-radius: 8px; color: var(--text);
  }
  .pager button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager .ellipsis { padding: 8px 2px; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>水木 · 每日资源清单</h1>
    <div class="source">来源：shuimu123.com · 已全部转存至夸克网盘</div>
  </header>

  <div class="notice">全部为本人网盘分享链接，永久有效、无提取码，点击即可跳转保存。</div>

  <input class="search" id="search" type="text" placeholder="搜索资源名称…" />

  <div class="count" id="count"></div>
  <div id="list"></div>

  <div class="pager" id="pager"></div>

  <footer>本页由自动化流程每日生成 · 资源归原作者所有，仅供学习交流</footer>
</div>

<script>
  // 资源数据：按更新日期分组，每天一组。
  // 字段：date 日期标题，items[].name 名称，items[].share 你的新分享链接
  const DAYS = [
    {
      date: "2026年10月27日",
      items: [
        { name: "AI暴力涨粉教学，外来技术请自行测试", share: "https://pan.quark.cn/s/130aed8d2b83" },
        { name: "WorkBuddy漫剧AI工作台实战课，掌握AI漫剧创作流程", share: "https://pan.quark.cn/s/7a484dbf2d3c" },
        { name: "Instagram跨境外贸私域实战课，零基础也能跑通海外订单", share: "https://pan.quark.cn/s/f0255ca62dd3" },
        { name: "MiniMax-H3从入门到实战全流程，零基础也能快速上手", share: "https://pan.quark.cn/s/2c3e2f279072" },
        { name: "千川投放从入门到精通，新手也能跑通高ROI投放", share: "https://pan.quark.cn/s/a6e5babe5080" },
        { name: "《普通人破局醒脑指南》：藏在人性中的生存智慧", share: "https://pan.quark.cn/s/0a93b58132fa" },
        { name: "高质量插画教程，多种风格系统提升绘画能力", share: "https://pan.quark.cn/s/1d1b3b3f092e" },
        { name: "OpenFilm一键成片工具，不会剪辑也能做短视频宣传片", share: "https://pan.quark.cn/s/90ded5e03cab" },
        { name: "恐龙争霸动画科普，带孩子认识恐龙界的生存绝技", share: "https://pan.quark.cn/s/078476cd30b1" }
      ]
    }
    // 以后每天新增一组即可，例如：
    // {
    //   date: "2026年10月28日",
    //   items: [ { name: "示例资源", share: "https://pan.quark.cn/s/xxxx" } ]
    // }
  ];

  const DAYS_PER_PAGE = 5; // 每页显示的天数
  let currentPage = 1;
  let query = "";

  const listEl = document.getElementById("list");
  const pagerEl = document.getElementById("pager");
  const countEl = document.getElementById("count");

  // 根据搜索词过滤：跨天筛选，命中项保留原日期分组
  function getDays() {
    if (!query) return DAYS;
    const q = query.toLowerCase();
    return DAYS
      .map(function (d) {
        const items = d.items.filter(function (it) {
          return it.name.toLowerCase().indexOf(q) > -1;
        });
        return { date: d.date, items: items };
      })
      .filter(function (d) { return d.items.length > 0; });
  }

  function renderDay(day, startSeq) {
    const block = document.createElement("div");
    block.className = "day";
    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = '<span>' + day.date + '</span><span class="cnt">' + day.items.length + ' 条</span>';
    block.appendChild(head);

    const body = document.createElement("div");
    body.className = "day-body";
    day.items.forEach(function (it, i) {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML =
        '<div class="name"><span class="seq">' + (startSeq + i) + '.</span>' + it.name + '</div>' +
        '<a class="btn" href="' + it.share + '" target="_blank" rel="noopener">保存</a>';
      body.appendChild(row);
    });
    block.appendChild(body);
    return block;
  }

  function render() {
    const days = getDays();
    if (days.length === 0) {
      listEl.innerHTML = '<div class="empty">没有匹配的资源</div>';
      countEl.textContent = "";
      pagerEl.innerHTML = "";
      return;
    }

    const totalItems = days.reduce(function (s, d) { return s + d.items.length; }, 0);
    const totalPages = query ? 1 : Math.ceil(days.length / DAYS_PER_PAGE);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const pageDays = query ? days : days.slice((currentPage - 1) * DAYS_PER_PAGE, currentPage * DAYS_PER_PAGE);

    listEl.innerHTML = "";
    let seq = 1;
    pageDays.forEach(function (d) {
      listEl.appendChild(renderDay(d, seq));
      seq += d.items.length;
    });

    countEl.textContent = "共 " + totalItems + " 条 · " + days.length + " 天";
    renderPager(totalPages);
  }

  function renderPager(totalPages) {
    pagerEl.innerHTML = "";
    if (query || totalPages <= 1) return;

    const mkBtn = function (label, page, opts) {
      opts = opts || {};
      const b = document.createElement("button");
      b.textContent = label;
      if (opts.active) b.className = "active";
      if (opts.disabled) b.disabled = true;
      if (!opts.disabled && !opts.active) {
        b.addEventListener("click", function () { currentPage = page; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
      }
      return b;
    };

    pagerEl.appendChild(mkBtn("上一页", currentPage - 1, { disabled: currentPage === 1 }));

    // 窗口化页码：首页、末页、当前页 ±1，间隔用省略号
    const set = new Set([1, totalPages, currentPage - 1, currentPage, currentPage + 1]);
    const pages = Array.from(set).filter(function (p) { return p >= 1 && p <= totalPages; }).sort(function (a, b) { return a - b; });
    let prev = 0;
    pages.forEach(function (p) {
      if (p - prev > 1) {
        const e = document.createElement("span");
        e.className = "ellipsis";
        e.textContent = "…";
        pagerEl.appendChild(e);
      }
      pagerEl.appendChild(mkBtn(String(p), p, { active: p === currentPage }));
      prev = p;
    });

    pagerEl.appendChild(mkBtn("下一页", currentPage + 1, { disabled: currentPage === totalPages }));
  }

  document.getElementById("search").addEventListener("input", function (e) {
    query = e.target.value.trim().toLowerCase();
    currentPage = 1;
    render();
  });

  render();
</script>
</body>
</html>
